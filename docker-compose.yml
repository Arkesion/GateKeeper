services:
  redis:
    image: redis:7-alpine
    container_name: gatekeeper-redis
    restart: unless-stopped

  webull-sidecar:
    build: ./sidecar
    container_name: gatekeeper-webull
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - WEBULL_TOKEN_DIR=/tmp/webull-tokens
    depends_on:
      - redis

  gatekeeper:
    build: .
    container_name: gatekeeper
    restart: unless-stopped
    ports:
      - "100.96.105.85:4000:3000"
    volumes:
      - gatekeeper-data:/data
    env_file:
      - .env
    environment:
      - TOKEN_PATH=/data/tokens.json
      - PUBLIC_URL=https://gatekeeper.veilforge.org
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - webull-sidecar

volumes:
  gatekeeper-data:
