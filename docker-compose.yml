services:
  redis:
    image: redis:7-alpine
    container_name: gatekeeper-redis
    restart: unless-stopped

  webull-sidecar:
    build: ./sidecar
    container_name: gatekeeper-webull
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - WEBULL_TOKEN_DIR=/tmp/webull-tokens
      - NODE_ENV=production
    depends_on:
      - redis

  gatekeeper:
    build: .
    container_name: gatekeeper
    restart: unless-stopped
    ports:
      - "100.96.105.85:4000:3000"
    volumes:
      - gatekeeper-data:/data
    env_file:
      - .env
    environment:
      - TOKEN_PATH=/data/tokens.json
      - PUBLIC_URL=https://gatekeeper.veilforge.org
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis
      - webull-sidecar
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gatekeeper-data:
