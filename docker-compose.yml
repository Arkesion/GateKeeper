services:
  gatekeeper:
    build: .
    container_name: gatekeeper
    restart: unless-stopped
    ports:
      - "443:3000"
    volumes:
      - /etc/gatekeeper/certs:/certs:ro
      - gatekeeper-data:/data
      - /home/ark/Gatekeeper/tokens.json:/app/tokens.json
    env_file:
      - .env
    environment:
      - CERT_PATH=/certs/cert.pem
      - KEY_PATH=/certs/key.pem

volumes:
  gatekeeper-data:
