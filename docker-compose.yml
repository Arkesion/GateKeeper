services:
  gatekeeper:
    build: .
    container_name: gatekeeper
    restart: unless-stopped
    ports:
      - "443:3000"
    volumes:
      - /etc/gatekeeper/certs:/certs:ro
      - gatekeeper-data:/data
    env_file:
      - .env
    environment:
      - CERT_PATH=/certs/cert.pem
      - KEY_PATH=/certs/key.pem
      - TOKEN_PATH=/data/tokens.json
      - PUBLIC_URL=https://gatekeeper.veilforge.org

volumes:
  gatekeeper-data:
