<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KQ-GateKeeper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      overflow: hidden;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      transform-origin: top left;
    }

    #ticker {
      text-align: center;
      font-size: 72px;
      font-weight: bold;
      color: #ffffff;
      padding: 12px 0 4px;
      letter-spacing: 8px;
      line-height: 1;
      cursor: text;
    }

    #ticker-input {
      background: transparent;
      border: none;
      border-bottom: 2px solid #555;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 72px;
      font-weight: bold;
      letter-spacing: 8px;
      text-align: center;
      width: 100%;
      outline: none;
      text-transform: uppercase;
      display: none;
    }

    #ticker-input:focus { border-bottom-color: #00ff41; }

    #price {
      text-align: center;
      font-size: 26px;
      color: #aaaaaa;
      padding: 4px 0 8px;
      transition: color 0.2s;
    }

    .divider {
      color: #555;
      text-align: center;
      font-size: 12px;
      padding: 2px 0;
      letter-spacing: 2px;
      border-top: 1px solid #444;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #columns {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      border-right: 1px solid #444;
      overflow: hidden;
    }

    .col:last-child { border-right: none; }

    .col-header {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 4px;
      padding-bottom: 8px;
    }

    .buy-header  { color: #00ff41; }
    .sell-header { color: #ff3333; }

    .col-divider {
      border-top: 1px dashed #444;
      margin-bottom: 10px;
    }

    .signal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #1a1a1a;
      gap: 8px;
    }

    .signal-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .signal-icon {
      font-size: 22px;
      font-weight: bold;
      min-width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .signal-label {
      font-size: 18px;
      flex: 1;
      white-space: nowrap;
    }

    .signal-detail {
      font-size: 14px;
      opacity: 0.7;
      text-align: right;
      min-width: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .row-pass { color: #00ff41; }
    .row-fail { color: #ff3333; }
    .row-warn { color: #ffaa00; }

    #verdicts {
      display: flex;
      border-top: 1px solid #444;
    }

    .verdict {
      flex: 1;
      text-align: center;
      padding: 12px 4px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      border-right: 1px solid #444;
    }

    .verdict:last-child { border-right: none; }
    .verdict-buy  { color: #00ff41; }
    .verdict-hold { color: #ffaa00; }
    .verdict-sell { color: #ff3333; }
    .verdict-wait { color: #444444; }

    #clockbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-top: 1px solid #444;
      background: #050505;
    }

    #clock {
      font-size: 96px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }

    #live-dot {
      font-size: 13px;
      color: #555;
      margin-left: 20px;
    }

    #live-dot.active { color: #00ff41; }

    #authPrompt {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #authPrompt p {
      color: #555;
      font-size: 14px;
      letter-spacing: 2px;
    }

    #authBtn {
      background: #000;
      border: 1px solid #00ff41;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      padding: 12px 28px;
      cursor: pointer;
      letter-spacing: 2px;
    }

    #authBtn:hover { background: #00ff41; color: #000; }
  </style>
</head>
<body>
<div id="app">

  <div id="ticker" onclick="startTickerEdit()" title="Click to change symbol">---</div>
  <input id="ticker-input" type="text" maxlength="6" placeholder="SYMBOL"
    onblur="commitTicker()"
    onkeydown="if(event.key==='Enter') commitTicker()">
  <div id="price">waiting...</div>
  <div class="divider">════════════════════════════════════════════════════════════</div>

  <div id="main">
    <div id="authPrompt">
      <p>NOT AUTHENTICATED</p>
      <button id="authBtn" onclick="authenticate()">[ LOGIN WITH SCHWAB ]</button>
      <p id="authStatus"></p>
    </div>
  </div>

  <div id="clockbar">
    <span id="clock">--:--:-- --</span>
    <span id="live-dot">● OFFLINE</span>
  </div>

</div>
<script>
  let currentSymbol = null;
  let pollInterval  = null;
  let authenticated = false;

  // ── AUTO SCALE ─────────────────────────────────────────────
  function autoScale() {
    const app = document.getElementById('app');
    app.style.transform = '';
    app.style.width     = '100%';
    app.style.height    = '100vh';
    const scaleX = window.innerWidth  / app.scrollWidth;
    const scaleY = window.innerHeight / app.scrollHeight;
    const scale  = Math.min(scaleX, scaleY);
    if (scale < 1) {
      app.style.transform = `scale(${scale})`;
      app.style.width     = `${100 / scale}%`;
      app.style.height    = `${100 / scale}vh`;
    }
  }

  window.addEventListener('resize', autoScale);

  // ── CLOCK ──────────────────────────────────────────────────
  function startClock() {
    function tick() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-US', {
          hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }
    tick();
    setInterval(tick, 1000);
  }

  startClock();

  // ── TICKER EDIT ────────────────────────────────────────────
  function startTickerEdit() {
    if (!authenticated) return;
    const display = document.getElementById('ticker');
    const input   = document.getElementById('ticker-input');
    display.style.display = 'none';
    input.style.display   = 'block';
    input.value = currentSymbol || '';
    input.focus();
    input.select();
  }

  function commitTicker() {
    const display = document.getElementById('ticker');
    const input   = document.getElementById('ticker-input');
    const val     = input.value.trim().toUpperCase();
    input.style.display   = 'none';
    display.style.display = 'block';
    if (val && val !== currentSymbol) {
      currentSymbol = val;
      display.textContent = val;
      if (pollInterval) clearInterval(pollInterval);
      const dot = document.getElementById('live-dot');
      dot.textContent = '● POLLING';
      dot.className   = '';
      fetchSignals();
      pollInterval = setInterval(fetchSignals, 500);
    }
  }

  // ── AUTH ───────────────────────────────────────────────────
  async function checkAuth() {
    const res  = await fetch('/api/status');
    const data = await res.json();
    authenticated = data.authenticated;
    if (authenticated) showPanel();
  }

  function authenticate() {
    document.getElementById('authStatus').textContent = 'Opening Schwab login...';
    window.open('/login', '_blank', 'width=600,height=700');
    const check = setInterval(async () => {
      const res  = await fetch('/api/status');
      const data = await res.json();
      if (data.authenticated) {
        clearInterval(check);
        authenticated = true;
        showPanel();
      }
    }, 2000);
  }

  function showPanel() {
    document.getElementById('main').innerHTML = `
      <div id="columns">
        <div class="col">
          <div class="col-header buy-header">BUY</div>
          <div class="col-divider"></div>
          <div id="buyRows"></div>
        </div>
        <div class="col">
          <div class="col-header sell-header">SELL</div>
          <div class="col-divider"></div>
          <div id="sellRows"></div>
        </div>
      </div>
      <div id="verdicts">
        <div class="verdict verdict-wait" id="buyVerdict">VERDICT: —</div>
        <div class="verdict verdict-wait" id="sellVerdict">VERDICT: —</div>
      </div>
    `;
    document.getElementById('live-dot').textContent = '● READY';
    autoScale();
  }

  // ── SIGNALS ────────────────────────────────────────────────
  async function fetchSignals() {
    if (!currentSymbol) return;
    try {
      const res = await fetch(`/api/signals/${currentSymbol}`);
      if (!res.ok) return;
      renderSignals(await res.json());
    } catch {
      const dot = document.getElementById('live-dot');
      dot.textContent = '● ERROR';
      dot.className   = '';
    }
  }

  function renderSignals(data) {
    const priceEl  = document.getElementById('price');
    const newPrice = data.price;
    const oldPrice = parseFloat(priceEl.dataset.last || newPrice);
    priceEl.textContent  = `$${newPrice?.toFixed(2) || '---'}`;
    priceEl.style.color  = newPrice > oldPrice ? '#00ff41' : newPrice < oldPrice ? '#ff3333' : '#aaaaaa';
    priceEl.dataset.last = newPrice;

    const buyRows = document.getElementById('buyRows');
    buyRows.innerHTML = '';
    let buyPass = 0;
    for (const [, sig] of Object.entries(data.buy)) {
      if (sig.value) buyPass++;
      const cls = sig.value ? 'row-pass' : 'row-fail';
      buyRows.innerHTML += `
        <div class="signal-row ${cls}">
          <span class="signal-label">${sig.label}</span>
          <span class="signal-detail">${sig.detail}</span>
          <span class="signal-icon">${sig.value ? '✓' : '✗'}</span>
        </div>`;
    }

    const sellRows = document.getElementById('sellRows');
    sellRows.innerHTML = '';
    let sellFire = 0;
    for (const [, sig] of Object.entries(data.sell)) {
      if (sig.value) sellFire++;
      const cls = sig.value ? 'row-fail' : 'row-pass';
      sellRows.innerHTML += `
        <div class="signal-row ${cls}">
          <span class="signal-label">${sig.label}</span>
          <span class="signal-detail">${sig.detail}</span>
          <span class="signal-icon">${sig.value ? '✓' : '✗'}</span>
        </div>`;
    }

    const buyV  = document.getElementById('buyVerdict');
    const sellV = document.getElementById('sellVerdict');

    if (buyPass === 6) {
      buyV.textContent = '⚡ SETUP READY — WATCH TAPE';
      buyV.className   = 'verdict verdict-buy';
    } else {
      buyV.textContent = `VERDICT: ${buyPass}/6 CONDITIONS MET`;
      buyV.className   = 'verdict verdict-wait';
    }

    if (sellFire >= 2) {
      sellV.textContent = '🔴 EXIT SIGNAL — SELL NOW';
      sellV.className   = 'verdict verdict-sell';
    } else if (sellFire === 1) {
      sellV.textContent = '⚠ CAUTION — WATCH TAPE';
      sellV.className   = 'verdict verdict-hold';
    } else {
      sellV.textContent = 'VERDICT: HOLD ✓';
      sellV.className   = 'verdict verdict-buy';
    }

    const dot = document.getElementById('live-dot');
    dot.textContent = '● LIVE';
    dot.className   = 'active';
  }

  checkAuth();
  autoScale();
</script>
</body>
</html>
